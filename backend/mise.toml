[env]
VALHALLA_TILE_EXTRACT = "../geo/data/valhalla_tiles.tar"

[tasks.csp]
run = "cargo sqlx prepare"

[tasks.migrate]
run = "sqlx migrate run"

[tasks.dev]
depends = ["//backend:migrate"]
run = "cargo run"

[tasks.build]
run = "podman build -f Dockerfile --build-arg MTA_API_URL={{env.MTA_API_URL}} -t ghcr.io/jonerrr/trainstatus-backend ."

[tasks."fixtures"]
description = "Capture, list, verify, or update expected fixture outputs; pass --help for command details"
raw_args = true
env = { SQLX_OFFLINE = "true" }
run = "cargo run --features fixture-capture --bin fixtures -- $@"

# Offline applies to compile-time query! metadata; SQLx tests still execute real SQL.
[tasks.test]
description = "Run the ordinary backend suite using existing PostgreSQL"
run = "mise run test:services full"

[tasks."test:unit"]
description = "Run private unit and public behavior tests without services"
env = { SQLX_OFFLINE = "true" }
run = "cargo test --features fixture-capture --lib --test behavior"

[tasks."test:integration"]
description = "Run database and private realtime engine integration tests"
run = "mise run test:services integration"

[tasks."test:performance"]
description = "Run the opt-in ingestion benchmark on an idle PostgreSQL server"
run = "mise run test:services performance"

[tasks."sqlx:check"]
description = "Check committed query metadata against migrations in a dedicated metadata-check database"
run = """
export DATABASE_URL="${SQLX_CHECK_DATABASE_URL:-postgres://trains:trains@localhost:5432/trainstatus_sqlx_check}"
sqlx database create
sqlx migrate run
cargo sqlx prepare --check -- --all-targets --features fixture-capture,integration-tests
"""

[tasks."test:services"]
description = "Run a suite on existing PostgreSQL; SQLx isolates test databases"
env = { SQLX_OFFLINE = "true", RUST_TEST_THREADS = "4" }
usage = """
arg "<suite>" {
  choices "full" "integration" "performance"
}
arg "[filter]" default="" help="Optional Rust test name filter"
"""
run = '''
#!/usr/bin/env bash
set -euo pipefail
# SQLx creates and migrates each test database; reuse the running dev server.
export DATABASE_URL="${TEST_DATABASE_URL:-postgres://trains:trains@localhost:5432/postgres}"
case "$usage_suite" in
  full)
    cargo test --features fixture-capture,integration-tests --lib --test behavior --test integration "$usage_filter"
    cargo test --features fixture-capture --doc "$usage_filter"
    ;;
  integration)
    cargo test --features fixture-capture,integration-tests --lib "realtime::tests::engine::$usage_filter"
    cargo test --features fixture-capture,integration-tests --test integration "$usage_filter"
    ;;
  performance)
    cargo test --features fixture-capture,integration-tests --test performance "$usage_filter" -- --ignored --test-threads=1 --nocapture
    ;;
esac
'''

# Host deps for compiling the valhalla crate (vendored C++).
# Install with: mise bootstrap packages apply
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:cmake" = "latest"
"apt:pkg-config" = "latest"
"apt:clang" = "latest"
"apt:libboost-dev" = "latest"
"apt:libprotobuf-dev" = "latest"
"apt:protobuf-compiler" = "latest"
"apt:zlib1g-dev" = "latest"

"dnf:cmake" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"dnf:clang" = "latest"
"dnf:clang-devel" = "latest"
"dnf:boost-devel" = "latest"
"dnf:protobuf-devel" = "latest"
"dnf:protobuf-compiler" = "latest"
"dnf:zlib-ng-compat-devel" = "latest"
