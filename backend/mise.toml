[env]
VALHALLA_TILE_EXTRACT = "../geo/artifacts/valhalla_tiles.tar"
TRAINSTATUS_DATA_DIR = "data"

[tasks.dev]
secrets = ["MTA_API_URL", "MTA_OBA_API_KEY", "NJT_USERNAME", "NJT_PASSWORD"]
run = "cargo run"

[tasks."dev:telemetry"]
secrets = ["MTA_API_URL", "MTA_OBA_API_KEY", "NJT_USERNAME", "NJT_PASSWORD"]
description = "Run the backend with OTLP export to the local Datadog Agent"
env = { OTEL_EXPORTER_OTLP_ENDPOINT = "http://127.0.0.1:4318", OTEL_EXPORTER_OTLP_PROTOCOL = "http/protobuf", OTEL_SERVICE_NAME = "trainstatus-backend", OTEL_RESOURCE_ATTRIBUTES = "deployment.environment.name=development", OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE = "Delta" }
run = "cargo run"

[tasks.build]
secrets = ["MTA_API_URL"]
run = "podman build -f Dockerfile --build-arg MTA_API_URL=${MTA_API_URL} -t ghcr.io/jonerrr/trainstatus-backend ."

[tasks."fixtures"]
description = "Capture, list, verify, or update expected fixture outputs; pass --help for command details"
secrets = ["MTA_API_URL", "MTA_OBA_API_KEY", "NJT_USERNAME", "NJT_PASSWORD"]
raw_args = true
run = "cargo run --features fixture-capture --bin fixtures -- $@"

[tasks.test]
description = "Run the full backend test suites (behavior, integration, and doctests)"
run = "mise run test:services full"

[tasks."test:unit"]
description = "Run private unit and public behavior tests without services"
env = { MTA_API_URL = "https://mta.invalid" }
run = "cargo test --locked --features fixture-capture --lib --test behavior"

[tasks."test:integration"]
description = "Run filesystem-backed integration and engine tests"
run = "mise run test:services integration"

[tasks."test:performance"]
description = "Run opt-in ingestion benchmarks"
run = "mise run test:services performance"

[tasks."test:services"]
description = "Run a suite using isolated local storage directories"
env = { MTA_API_URL = "https://mta.invalid", RUST_TEST_THREADS = "4" }
usage = """
arg "<suite>" {
  choices "full" "integration" "performance"
}
arg "[filter]" default="" help="Optional Rust test name filter"
"""
run = '''
#!/usr/bin/env bash
set -euo pipefail
case "$usage_suite" in
  full)
    cargo test --features fixture-capture,integration-tests --lib --test behavior --test integration "$usage_filter"
    cargo test --features fixture-capture --doc "$usage_filter"
    ;;
  integration)
    cargo test --features fixture-capture,integration-tests --lib "operations::tests::engine::$usage_filter"
    cargo test --features fixture-capture,integration-tests --test integration "$usage_filter"
    ;;
  performance)
    cargo test --features fixture-capture,integration-tests --test performance "$usage_filter" -- --ignored --test-threads=1 --nocapture
    ;;
esac
'''

[tasks."smoke:storage"]
description = "Exercise local SSD storage, HTTP handlers, and restart recovery"
env = { MTA_API_URL = "https://mta.invalid" }
run = "cargo test --locked --features fixture-capture,integration-tests --test storage_smoke storage_cutover -- --exact --ignored --nocapture --test-threads=1"

[tasks.openapi]
description = "Export the current OpenAPI contract without starting workers"
env = { MTA_API_URL = "https://mta.invalid" }
run = "cargo run --bin openapi"

# Host deps for compiling the valhalla crate (vendored C++).
# Install with: mise bootstrap packages apply
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:cmake" = "latest"
"apt:pkg-config" = "latest"
"apt:clang" = "latest"
"apt:libboost-dev" = "latest"
"apt:libprotobuf-dev" = "latest"
"apt:protobuf-compiler" = "latest"
"apt:zlib1g-dev" = "latest"

"dnf:cmake" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"dnf:clang" = "latest"
"dnf:clang-devel" = "latest"
"dnf:boost-devel" = "latest"
"dnf:protobuf-devel" = "latest"
"dnf:protobuf-compiler" = "latest"
"dnf:zlib-ng-compat-devel" = "latest"
