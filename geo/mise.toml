[env]
GEO_DATA_IMAGE = "ghcr.io/jonerrr/trainstatus-geo-data:latest"
GEO_ASSETS_IMAGE = "ghcr.io/jonerrr/trainstatus-geo-assets:latest"

[tasks.build]
run = { tasks = ["//geo:build:data", "//geo:build:assets"] }

[tasks."build:data"]
description = "Build geo data image (bump VALHALLA_VERSION ARG in Dockerfile when upgrading)"
run = "podman build -f Dockerfile -t $GEO_DATA_IMAGE ."

[tasks."build:assets"]
run = "podman build -f Dockerfile.assets -t $GEO_ASSETS_IMAGE ."

[tasks.export]
# TODO: remove other exports once 100% sure they aren't needed
description = "Export Valhalla tile extract for local development via podman mount"
run = '''
#!/usr/bin/env bash
set -euo pipefail

image="$GEO_DATA_IMAGE"
out_dir="${MISE_CONFIG_ROOT}/data"
container_id="$(podman create "$image")"
mounted=0

cleanup() {
	if [[ "$mounted" -eq 1 ]]; then
		podman unshare podman umount "$container_id" >/dev/null 2>&1 || true
	fi
	podman rm -f "$container_id" >/dev/null 2>&1 || true
}
trap cleanup EXIT

mkdir -p "$out_dir"

# Rootless mount only works inside the user namespace (podman-mount(1)).
mnt="$(podman unshare podman mount "$container_id")"
mounted=1

podman unshare bash -c "
	set -euo pipefail
	cp \"${mnt}/valhalla_tiles.tar\" \"${out_dir}/valhalla_tiles.tar\"
	# cp \"${mnt}/basemap.mbtiles\" \"${out_dir}/basemap.mbtiles\"
"

echo "Exported artifacts from $image to $out_dir"
'''
