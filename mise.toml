monorepo_root = true

[monorepo]
config_roots = ["backend", "frontend", "geo", "science"]

[tools]
"aqua:astral-sh/uv" = "latest"
"core:rust" = "latest"
"core:node" = "latest"
"aqua:pnpm/pnpm" = "latest"
"pipx:pyvalhalla" = { version = "latest", uvx = true }
"cargo:sqlx-cli" = { version = "latest", features = "native-tls,postgres", default-features = false }
# installing with mise caused the rust vscode extension not to work, and a
# newer mise protoc breaks Valhalla's CMake (mismatched vs system libprotobuf)
# protoc = "latest"

[env]
DATABASE_URL = "postgres://trains:trains@localhost:5432/trains"
REDIS_URL = "redis://localhost:6379"

[tasks."containers:init"]
description = "Create the pods for development."
run = "podman kube play dev.pod.yml --replace"

[tasks.dev]
# broken since it the sqlx mig fails because the database isn't ready yet. need to add a wait-for step or something.
# depends = ["start-containers"]
run = { tasks = ["//backend:dev", "//frontend:dev"] }

[tasks.reset-db]
confirm = "Are you sure?"
run = """
podman kube down dev.pod.yml --force || true
podman kube play --replace dev.pod.yml
"""

[tasks.build]
run = { tasks = ["//backend:build", "//frontend:build"] }

[tasks.demo]
run = "podman kube play --replace demo.pod.yml --configmap demo.configmap.yml"
