name: release-please

on:
    push:
        branches:
            - master

permissions:
    contents: read

concurrency:
    group: release-please
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.releases_created }}
            version: ${{ steps.release.outputs['backend--version'] }} # versions will always be synced
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  target-branch: master

    build-and-push:
        needs:
            - release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - component: backend
                      context: ./backend
                      image: ghcr.io/${{ github.repository_owner }}/trainstatus-backend
                    - component: frontend
                      context: ./frontend
                      image: ghcr.io/${{ github.repository_owner }}/trainstatus-frontend

        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ matrix.image }}
                  tags: |
                      latest
                      ${{ needs.release-please.outputs.version }}

            - name: Build and push Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ${{ matrix.context }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.component }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.component }}
                  build-args: |
                      MTA_API_URL=${{ secrets.MTA_API_URL }}
