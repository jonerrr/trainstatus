name: Update Geo Assets

on:
    workflow_dispatch:
        inputs:
            style_base_urls:
                description: Comma-separated base URLs for generated style JSON files
                required: false
                default: "http://localhost:5173,https://trainstat.us"

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Login to GitHub Container Registry
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
              with:
                  images: ghcr.io/${{ github.repository_owner }}/trainstatus-geo-assets
                  tags: |
                      latest

            - name: Build and push Docker image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: ./geo
                  file: ./geo/Dockerfile.assets
                  push: true
                  build-args: |
                      STYLE_BASE_URLS=${{ inputs.style_base_urls || 'http://localhost:5173,https://trainstat.us' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
